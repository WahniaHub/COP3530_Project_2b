<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <title>Sortify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>The Great Playlist Sorter</h1>
    <div id = "controls">
    <h2>Select Category
        <select id="category">
            <option value="artists">Artists</option>
            <option value="track_name">Track Name</option>
            <option value="track_genre">Track Genre</option>
            <option value="duration">Duration</option>
            <option value="popularity">Popularity</option>
            <option value="tempo">Tempo</option>
            <option value="energy">Energy</option>
            <option value="danceability">Danceability</option>
        </select>
    </h2>
    <h2>Select Algorithm
        <select id="algorithm">
            <option value="merge">Merge Sort</option>
            <option value="quick">Quick Sort</option>
        </select>
    </h2>
        <h2>Select Direction
        <select id="direction">
            <option value="descending">Descending</option>
            <option value="ascending">Ascending</option>
        </select>
    </h2>
    <button type="button" id="sort">Click to Sort</button>
    </div>
    <h3 id="counter">Comparisons:</h3>
    <div id="table-wrap">
    <table>
        <thead><tr><th>Artists</th><th>Track Name</th><th>Genre</th><th>Duration</th><th>Popularity</th><th>Tempo</th><th>Energy</th><th>Danceability</th></tr></thead>
        <tbody id="tableinfo"></tbody>
    </table>
    </div>
    <script src="web.js"></script>
</body>
</html>
